name: nmms-unpack

# Runs natively on GitHub's free aarch64 runner (ubuntu-24.04-arm).
# Inputs live in input/ (extracted from the APK, not the whole 143 MB apk):
#   input/libondevx.so   lib/arm64-v8a/libondevx.so
#   input/k              assets/ondev/k        (69 bytes, "OKDF"+flag+64)
#   input/p              assets/ondev/p        (22,242,864 bytes ciphertext)
#   input/CERT.RSA       META-INF/CERT.RSA
#
# Output artifact: nmms-decrypted { payload.bin, classes*.dex, run.log }

on:
  workflow_dispatch:
    inputs:
      nx_offset:
        description: "nx_decrypt offset inside libondevx.so"
        required: false
        default: "0x1ea3c"
  push:
    paths:
      - "input/**"
      - "harness/**"
      - ".github/workflows/unpack.yml"

jobs:
  unpack:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Runner info
        run: |
          uname -a
          lscpu | head -8

      - name: Toolchain check
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq file binutils xxd
          cc --version | head -1

      - name: Input check
        run: |
          ls -l input/
          file input/libondevx.so
          echo "--- k ---";  xxd input/k
          echo "--- p head ---"; xxd -l 32 input/p

      - name: Build shim + harness
        run: |
          set -e
          # libondevx.so NEEDs liblog.so libm.so libdl.so libc.so.
          # On Ubuntu, libm.so / libdl.so / libc.so in /lib/aarch64-linux-gnu
          # are GNU ld *linker scripts* (ASCII), not ELF -> dlopen says
          #   "invalid ELF header"
          # so we point the bare sonames at the real objects.
          mkdir -p harness/shim
          resolve() { ldconfig -p | awk -v w="$1" '$1==w {print $NF; exit}'; }
          for pair in "libm.so:libm.so.6" "libdl.so:libdl.so.2" "libc.so:libc.so.6"; do
            dst=${pair%%:*}; src=${pair##*:}
            real=$(resolve "$src")
            echo "$dst -> $real"
            ln -sf "$real" "harness/shim/$dst"
          done
          # liblog.so does not exist on Linux at all: build our own with the
          # bionic symbols the lib imports.
          cc -shared -fPIC -O2 -o harness/shim/liblog.so harness/shim.c
          echo "--- shim dir ---"
          ls -l harness/shim/
          for f in harness/shim/liblog.so; do file "$f"; done
          echo "--- exported shim symbols ---"
          nm -D --defined-only harness/shim/liblog.so | awk '{print $3}' | grep -v '^$' | sort
          # the caller
          cc -O2 -g -Wall -o harness/nxrun harness/nxrun.c -ldl
          file harness/nxrun

      - name: Show recoverable symbols
        run: |
          nm -C --defined-only input/libondevx.so 2>/dev/null \
            | grep -iE "nx_decrypt|nx_inspect|nx_watch|nx_scrub|hkdf|aes_cbc|decrypt_block" || true

      - name: Run nx_decrypt
        id: run
        continue-on-error: true
        run: |
          set +e
          export LD_LIBRARY_PATH="$PWD/harness/shim:$LD_LIBRARY_PATH"
          harness/nxrun \
            input/libondevx.so \
            input/k \
            input/p \
            input/CERT.RSA \
            payload.bin \
            "${{ inputs.nx_offset || '0x1ea3c' }}" \
            2>&1 | tee run.log
          rc=${PIPESTATUS[0]}
          echo "rc=$rc"
          echo "=== payload ==="
          ls -l payload.bin 2>/dev/null && xxd -l 64 payload.bin
          exit $rc

      - name: Carve DEX
        id: carve
        if: steps.run.outcome == 'success'
        continue-on-error: true
        run: |
          set -e
          mkdir -p out
          python3 - <<'PY'
          import struct, os

          data = open('payload.bin','rb').read()
          print('payload', len(data), 'bytes; magic', data[:8])

          if data[:4] == b'ODEX':
              count = struct.unpack_from('<H', data, 4)[0]
              print('dex count =', count)
              pos = 6
              for i in range(count):
                  nl = data[pos]; pos += 1
                  name = data[pos:pos+nl].decode('utf-8','replace'); pos += nl
                  off, ln = struct.unpack_from('<II', data, pos); pos += 8
                  print(f'  [{i}] name={name!r} off={off} len={ln} magic={data[off:off+8]!r}')
                  out = 'out/' + (name if name.endswith('.dex') else f'classes{i}.dex')
                  os.makedirs(os.path.dirname(out) or '.', exist_ok=True)
                  open(out,'wb').write(data[off:off+ln])
          else:
              # carve any embedded dex
              n = 0; i = 0
              while True:
                  i = data.find(b'dex\n035', i)
                  if i < 0: break
                  print('dex magic at', i)
                  open(f'out/classes{n}.dex','wb').write(data[i:])
                  n += 1; i += 8
              print('carved', n)
          PY
          ls -l out/ || true

      - name: Diagnose on failure
        if: steps.run.outcome != 'success'
        run: |
          echo "=== tail of run.log ==="
          tail -50 run.log || true
          echo "=== .text / .data range (to sanity-check the offset) ==="
          readelf -SW input/libondevx.so | grep -E "\.text|\.data|\.bss"

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmms-decrypted
          path: |
            out/
            payload.bin
            run.log
          if-no-files-found: warn
          retention-days: 7
