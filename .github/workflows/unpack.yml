name: nmms-unpack

# Runs natively on GitHub's free aarch64 runner (ubuntu-24.04-arm).
# Inputs live in input/ (extracted from the APK, not the whole 143 MB apk):
#   input/libondevx.so   lib/arm64-v8a/libondevx.so
#   input/k              assets/ondev/k        (69 bytes, "OKDF"+flag+64)
#   input/p              assets/ondev/p        (22,242,864 bytes ciphertext)
#   input/CERT.RSA       META-INF/CERT.RSA
#
# Output artifact: nmms-decrypted { payload.bin, classes*.dex, run.log }

on:
  workflow_dispatch:
    inputs:
      nx_offset:
        description: "nx_decrypt offset inside libondevx.so"
        required: false
        default: "0x1ea3c"
  push:
    paths:
      - "input/**"
      - "harness/**"
      - ".github/workflows/unpack.yml"

jobs:
  unpack:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Runner info
        run: |
          uname -a
          lscpu | head -8

      - name: Toolchain check
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq file binutils xxd
          cc --version | head -1

      - name: Input check
        run: |
          ls -l input/
          file input/libondevx.so
          echo "--- k ---";  xxd input/k
          echo "--- p head ---"; xxd -l 32 input/p

      - name: Build shim + harness
        run: |
          set -e
          # libondevx.so NEEDs liblog.so libm.so libdl.so libc.so.
          # On Ubuntu, libm.so / libdl.so / libc.so in /lib/aarch64-linux-gnu
          # are GNU ld *linker scripts* (ASCII), not ELF -> dlopen says
          #   "invalid ELF header"
          # so we point the bare sonames at the real objects.
          mkdir -p harness/shim
          resolve() { ldconfig -p | awk -v w="$1" '$1==w {print $NF; exit}'; }
          for pair in "libm.so:libm.so.6" "libdl.so:libdl.so.2" "libc.so:libc.so.6"; do
            dst=${pair%%:*}; src=${pair##*:}
            real=$(resolve "$src")
            echo "$dst -> $real"
            ln -sf "$real" "harness/shim/$dst"
          done
          # liblog.so does not exist on Linux at all: build our own with the
          # bionic symbols the lib imports.
          cc -shared -fPIC -O2 -o harness/shim/liblog.so harness/shim.c
          echo "--- shim dir ---"
          ls -l harness/shim/
          for f in harness/shim/liblog.so; do file "$f"; done
          echo "--- exported shim symbols ---"
          nm -D --defined-only harness/shim/liblog.so | awk '{print $3}' | grep -v '^$' | sort
          # the caller
          cc -O2 -g -Wall -o harness/nxrun harness/nxrun.c -ldl
          file harness/nxrun

      - name: dlopen smoke test
        continue-on-error: true
        run: |
          set +e
          cat > /tmp/t.c <<'EOC'
          #include <stdio.h>
          #include <dlfcn.h>
          int main(int c, char**v){
            setvbuf(stderr,NULL,_IONBF,0);
            fprintf(stderr,"before dlopen\n");
            void *h = dlopen(v[1], RTLD_NOW|RTLD_LOCAL);
            if(!h){ fprintf(stderr,"FAIL: %s\n", dlerror()); return 1; }
            fprintf(stderr,"dlopen OK\n");
            return 0;
          }
          EOC
          cc -O2 -o /tmp/t /tmp/t.c -ldl
          export LD_LIBRARY_PATH="$PWD/harness/shim"
          echo "== with shim =="
          /tmp/t input/libondevx.so; echo "rc=$?"
          echo "== LD_DEBUG versions =="
          LD_DEBUG=versions /tmp/t input/libondevx.so 2>&1 | tail -20 || true
          echo "== LD_DEBUG symbols (resolved) =="
          LD_DEBUG=symbols /tmp/t input/libondevx.so 2>&1 | grep -iE "error|fail|not found|unresolved" | head -20 || true
          echo "== gdb backtrace =="
          sudo apt-get install -y -qq gdb || true
          gdb -batch -nx -ex "run" -ex "bt 25" -ex "info registers pc x0 x1 x2"               --args /tmp/t input/libondevx.so 2>&1 | tail -40 || true
          echo "== gdb backtrace RTLD_LAZY =="
          sed 's/RTLD_NOW/RTLD_LAZY/' /tmp/t.c > /tmp/tl.c
          cc -O2 -o /tmp/tl /tmp/tl.c -ldl
          gdb -batch -nx -ex "run" -ex "bt 25" --args /tmp/tl input/libondevx.so 2>&1 | tail -30 || true
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/harness/shim

      - name: Extract X.509 cert from CERT.RSA
        run: |
          python3 - <<'PY'
          import hashlib
          d = open('input/CERT.RSA','rb').read()

          def read_len(b, i):
              n = b[i]; i += 1
              if n < 0x80: return n, i
              k = n & 0x7f
              return int.from_bytes(b[i:i+k], 'big'), i + k

          # CERT.RSA is PKCS#7 SignedData. Find every SEQUENCE that looks like
          # an X.509 TBSCertificate: [0] version?, INTEGER serial, SEQUENCE alg
          found = []
          for a in range(len(d) - 4):
              if d[a] != 0x30: continue
              ln, j = read_len(d, a + 1)
              if j + ln > len(d) or ln < 200: continue
              k = j
              if k < len(d) and d[k] == 0xa0:
                  _, k = read_len(d, k + 1)
              if k < len(d) and d[k] == 0x02:
                  _, k = read_len(d, k + 1)
              if k < len(d) and d[k] == 0x30:
                  found.append((a, ln, j))
          print('candidates:', [(hex(a), l) for a, l, _ in found])
          a, ln, j = max(found, key=lambda t: t[1])   # the real cert is the longest match
          blob = d[a:j+ln]
          print('picked offset', hex(a), 'len', len(blob))
          open('input/cert.der','wb').write(blob)
          print('sha256(cert.der) =', hashlib.sha256(blob).hexdigest())
          PY
          ls -l input/cert.der
          xxd -l 32 input/cert.der

      - name: Show recoverable symbols
        run: |
          nm -C --defined-only input/libondevx.so 2>/dev/null \
            | grep -iE "nx_decrypt|nx_inspect|nx_watch|nx_scrub|hkdf|aes_cbc|decrypt_block" || true

      - name: Run nx_decrypt
        id: run
        continue-on-error: true
        run: |
          set +e
          export LD_LIBRARY_PATH="$PWD/harness/shim:$LD_LIBRARY_PATH"
          harness/nxrun \
            input/libondevx.so \
            input/k \
            input/p \
            input/cert.der \
            payload.bin \
            "${{ inputs.nx_offset || '0x1ea3c' }}" \
            2>&1 | tee run.log
          rc=${PIPESTATUS[0]}
          echo "rc=$rc"
          echo "=== payload ==="
          ls -l payload.bin 2>/dev/null && xxd -l 64 payload.bin
          echo "=== gdb: dump AES key/iv at first block ==="
          cat > /tmp/g.gdb <<'EOC'
          set pagination off
          set confirm off
          break nx_decrypt
          run
          break *($pc + 0x480)
          continue
          printf "--- key @sp+0x90 ---\n"
          x/32xb $sp+0x90
          printf "--- iv  @sp+0x120 ---\n"
          x/16xb $sp+0x120
          printf "--- plain ptr ---\n"
          p/x $x20
          EOC
          gdb -batch -nx -x /tmp/g.gdb \
              --args harness/nxrun input/libondevx.so input/k input/p \
                     input/cert.der payload.bin "0x1ea3c" 2>&1 | tail -30 || true
          echo "=== gdb: raw stack probe ==="
          cat > /tmp/g2.gdb <<'EOC'
          set pagination off
          set confirm off
          break *(nx_decrypt+0x480)
          run
          x/48xb $sp+0x90
          x/16xb $sp+0x120
          bt 3
          EOC
          gdb -batch -nx -x /tmp/g2.gdb \
              --args harness/nxrun input/libondevx.so input/k input/p \
                     input/cert.der payload.bin "0x1ea3c" 2>&1 | tail -30 || true
          echo "=== gdb backtrace of nxrun ==="
          sudo apt-get install -y -qq gdb >/dev/null 2>&1 || true
          gdb -batch -nx -ex run -ex "bt 20" -ex "info registers pc"               --args harness/nxrun input/libondevx.so input/k input/p                      input/cert.der payload.bin                      "${{ inputs.nx_offset || '0x1ea3c' }}" 2>&1 | tail -35 || true
          exit $rc

      - name: Carve DEX
        id: carve
        if: steps.run.outcome == 'success'
        continue-on-error: true
        run: |
          set -e
          mkdir -p out
          python3 - <<'PY'
          import struct, os

          data = open('payload.bin','rb').read()
          print('payload', len(data), 'bytes; magic', data[:8])

          if data[:4] == b'ODEX':
              count = struct.unpack_from('<H', data, 4)[0]
              print('dex count =', count)
              pos = 6
              for i in range(count):
                  nl = data[pos]; pos += 1
                  name = data[pos:pos+nl].decode('utf-8','replace'); pos += nl
                  off, ln = struct.unpack_from('<II', data, pos); pos += 8
                  print(f'  [{i}] name={name!r} off={off} len={ln} magic={data[off:off+8]!r}')
                  out = 'out/' + (name if name.endswith('.dex') else f'classes{i}.dex')
                  os.makedirs(os.path.dirname(out) or '.', exist_ok=True)
                  open(out,'wb').write(data[off:off+ln])
          else:
              # carve any embedded dex
              n = 0; i = 0
              while True:
                  i = data.find(b'dex\n035', i)
                  if i < 0: break
                  print('dex magic at', i)
                  open(f'out/classes{n}.dex','wb').write(data[i:])
                  n += 1; i += 8
              print('carved', n)
          PY
          ls -l out/ || true

      - name: Diagnose on failure
        if: steps.run.outcome != 'success'
        run: |
          echo "=== tail of run.log ==="
          tail -50 run.log || true
          echo "=== .text / .data range (to sanity-check the offset) ==="
          readelf -SW input/libondevx.so | grep -E "\.text|\.data|\.bss"

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmms-decrypted
          path: |
            out/
            payload.bin
            run.log
          if-no-files-found: warn
          retention-days: 7
